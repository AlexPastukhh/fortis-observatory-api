name: Recovered Observatory API — synthetic tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python312-linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_IMAGE: docker.io/library/python@sha256:05a994d2344eb364cc186910f4fc8786a38215f39f00d0acc25bff33a08f4177
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Pull immutable amd64 base
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$BASE_IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$BASE_IMAGE")" = "linux/amd64"

      - name: Build isolated candidate image
        shell: bash
        run: |
          set -euo pipefail
          docker --context=default buildx build --builder default \
            --platform linux/amd64 --network none --pull=false --load \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --file Dockerfile.candidate --tag ownapi01:ci .

      - name: Validate pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm --network none --read-only --entrypoint python3 ownapi01:ci --version)" = "Python 3.12.16"
          test "$(docker run --rm --network none --read-only --entrypoint id ownapi01:ci -u)" = "1000"
          docker run --rm --network none --read-only --entrypoint cat ownapi01:ci /etc/os-release | grep -Eq '^VERSION_ID="?13"?$'

      - name: Run 57 synthetic tests (including direct TLS) without runtime volumes
        shell: bash
        run: |
          set -euo pipefail
          # The pinned Python runtime need not contain openssl. Only the
          # Ubuntu CI runner creates short-lived synthetic TLS fixtures.
          # Nothing is baked into Docker, committed or printed to stdout.
          command -v openssl >/dev/null
          fixture_dir="$(mktemp -d /tmp/ownapi-tls.XXXXXXXX)"
          cleanup() { sudo rm -rf -- "$fixture_dir"; }
          trap cleanup EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=fortis-observatory-api' \
            -addext 'subjectAltName=DNS:fortis-observatory-api' \
            -out "$fixture_dir/cert.pem" -keyout "$fixture_dir/key.pem" \
            >/dev/null 2>&1
          sudo chown 1000:1000 "$fixture_dir" "$fixture_dir/cert.pem" "$fixture_dir/key.pem"
          sudo chmod 0700 "$fixture_dir"
          sudo chmod 0644 "$fixture_dir/cert.pem"
          sudo chmod 0600 "$fixture_dir/key.pem"
          docker run --rm \
            --network none --read-only --user 1000:1000 \
            --security-opt no-new-privileges --cap-drop ALL \
            --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs '/tmp:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=1777' \
            --mount "type=bind,source=$PWD/tests,target=/tests,readonly" \
            --mount "type=bind,source=$fixture_dir,target=/test-fixtures,readonly" \
            --env OWNAPI_TEST_TLS_CERT=/test-fixtures/cert.pem \
            --env OWNAPI_TEST_TLS_KEY=/test-fixtures/key.pem \
            --env OWNAPI_SOURCE_DIR=/app \
            --entrypoint python3 ownapi01:ci \
            -I -B -m unittest discover -s /tests -p 'test_*.py' -v 2>&1 | tee test-output.log
          grep -Eq '^Ran 57 tests in [0-9.]+s$' test-output.log
          grep -qx 'OK' test-output.log
          if grep -Eq 'skipped=[1-9]|failures=[1-9]|errors=[1-9]' test-output.log; then exit 1; fi
